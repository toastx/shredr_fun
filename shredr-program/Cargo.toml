[package]
name = "shredr-program"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["lib", "cdylib"]

[dependencies]
ephemeral-rollups-pinocchio = "0.11.2"
pinocchio = "0.10.2"
pinocchio-log = "0.5.1"
pinocchio-pubkey = "0.3.0"
pinocchio-system = "0.5.0"
shank = "0.4.8"

# Host builds only, so `cargo test` can derive note commitments the same way the
# program does. The SBF target uses the `sol_sha256` syscall and never links this.
[target.'cfg(not(target_os = "solana"))'.dependencies]
sha2 = { version = "0.10", default-features = false }

[features]
default = ["devnet"]
logging = []
# Network selection for the pinned MagicBlock TEE validator (see constants::tee_validator).
# devnet: no pinned validator (network default). mainnet: pin TEE_VALIDATOR_MAINNET.
devnet = []
mainnet = []

# `overflow-checks` is the one that matters: the arithmetic here is bounded by
# explicit guards rather than by types, and a release build without it wraps
# silently instead of aborting. The rest is standard SBF release tuning.
[profile.release]
overflow-checks = true
lto = "fat"
codegen-units = 1
opt-level = 3

[[bench]]
name = "compute_units"
harness = false


# NOTE: lint with `cargo clippy --lib`, not `--all-targets`.
#
# The dev-dependencies below pull `solana-address` in with `std`/`alloc` via
# mollusk -> solana-pubkey. Under those features `Address` implements `Copy`, so
# `--all-targets` reports `clone_on_copy` on the `burner_key` clones in
# initialize_delegate.rs. The SBF build has no dev-dependencies, `Address` is not
# `Copy` there, and removing those clones fails to compile.

[dev-dependencies]
mollusk-svm = "0.14.0"
mollusk-svm-bencher = "0.14.0"
solana-account = "4.3"
solana-instruction = "3.4"
solana-program-error = "3.0"
# `curve25519` enables off-chain `find_program_address`, needed to derive the
# stealth PDAs from the host side of the tests.
solana-pubkey = { version = "4.2", features = ["curve25519"] }
solana-sdk-ids = "3.1"
# An independent sha256 for the tests, so the Merkle assertions do not lean on
# the same implementation they are checking.
sha2 = "0.10"
